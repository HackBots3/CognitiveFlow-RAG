[project]
name = "cognitiveflow-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.30",
    "redis>=5.0",
    "qdrant-client>=1.11",
    "celery>=5.4",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langgraph>=0.2",
    "langfuse>=2.50",
    "pypdf>=5.0",
    "unstructured>=0.15",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "structlog>=24.4",
    "tavily-python>=0.5",
    "sentence-transformers>=3.1",
    "rank-bm25>=0.2.2",
    "ragas>=0.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
